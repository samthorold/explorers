[package]
name = "explorers-app"
version = "0.1.0"
edition = "2024"

[dependencies]
explorers-sim.workspace = true
explorers-genesis-eval.workspace = true
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.33"
egui_plot = "0.34"
rand.workspace = true
serde_json.workspace = true

# On Linux winit needs a display backend to compile at all (default features are
# off above), so CI's Linux runner can build and lint the app. x11 loads its
# libraries at run time, so the build needs no system packages.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts", "x11"] }

[dev-dependencies]
explorers-genesis.workspace = true
