name: CI

on:
  # PRs must be up to date and pass before merging, so re-running on main adds
  # nothing, except when a lock file or the toolchain changes: PRs can only
  # restore caches saved on main, so this keeps the cargo cache warm for them.
  push:
    branches: [main]
    paths: [Cargo.lock, rust-toolchain.toml]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    # macOS on Apple silicon, where the golden tests' exact f32 bits were
    # captured: libm's transcendental functions (exp, powf, ...) differ in the
    # last bits between Apple's libm and glibc, so a Linux runner reads other
    # bits. The app's eframe build (default features off) also has no Linux
    # display backend.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1

      # The toolchain rust-toolchain.toml pins.
      - name: Install Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2.9.2

      # uv provides pre-commit (and the Python its hooks need).
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"

      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # Same hooks as local commits: file hygiene, actionlint, shellcheck, and
      # cargo fmt, clippy and test.
      - name: Run pre-commit
        run: uvx pre-commit@4.7.0 run --all-files --show-diff-on-failure
